  local_verify: ./scripts/local-verify.sh
  browser_check: ./scripts/browser-check.sh
  smoke: ./scripts/smoke.sh
  rollback: ./scripts/rollback.sh

urls:
  local: null
  staging: null
  live: null

critical_pages:
  - /

critical_flows:
  - open_main_page

database:
  enabled: unknown
  backup_required_before_live_change: true

deploy:
  live_requires_phrase: "Разрешаю выложить на живой проект"

